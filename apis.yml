aid: more-health
name: MORE Health
description: >-
  MORE Health, Inc. is a global digital health company headquartered in San Mateo, California, with
  offices in Boston, Houston, New York, Beijing, Shanghai, Chengdu and Guangzhou. It provides expert
  medical second opinions and cross-border telemedicine through its proprietary, cloud-based Physician
  Collaboration Platform, which lets a patient's treating physician and an expert specialist jointly
  review medical history, hospital records, lab results, DICOM imaging, pathology imaging and genetic
  testing, and co-develop a diagnosis and treatment plan over HIPAA-compliant video conferencing with
  translation in 129 languages. Product lines include Expert Medical Opinion, MORE Health for Kids,
  employee benefits for self-insured groups, a Medical Travel Concierge, mental health, Prodigy
  Fertility and hospital solutions for health systems seeking international patient reach. The company
  states it serves 6.2 million members across six continents and that its platform is ISO 27001
  certified and GDPR- and HIPAA-compliant. MORE Health publishes no public developer program, API
  reference, or machine-readable specification of any kind; the platform is sold to patients,
  employers and hospitals as an end-user product.
